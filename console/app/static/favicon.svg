<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="RustDesk Console">
  <!-- Broadcast mark: a centre dot emitting rings - peers announce themselves by
       heartbeat. Slate ground, indigo mark, matching the console theme. -->
  <rect width="32" height="32" rx="7" fill="#111827"/>
  <circle cx="16" cy="16" r="11.5" fill="none" stroke="#818CF8" stroke-width="2.2" opacity="0.35"/>
  <circle cx="16" cy="16" r="7" fill="none" stroke="#818CF8" stroke-width="2.4" opacity="0.75"/>
  <circle cx="16" cy="16" r="3.2" fill="#A5B4FC"/>
</svg>
