[Unit]
# The reveal endpoint reads the vault mount, so the unit must not start before
# it is there. With a plain _netdev mount this also guarantees the mount exists
# in the service's own namespace, which a late-triggered automount would not.
RequiresMountsFor=/mnt/rustdesk-vault

[Service]
# ProtectSystem=strict makes the whole filesystem read-only for this unit, so
# the audit log needs an explicitly writable directory. LogsDirectory creates
# /var/log/rdmon owned by the service user.
LogsDirectory=rdmon
LogsDirectoryMode=0750
# smbcacls insists on a writable HOME for its gencache; without it every owner
# check fails with "Failed to expand path: ~/.cache/samba".
CacheDirectory=rdmon
CacheDirectoryMode=0750
Environment=HOME=/var/cache/rdmon
